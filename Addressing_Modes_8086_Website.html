#logobar{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top,0px));
  right:18px;
  z-index:50;
}
.logo-cyl{
  width:78px; height:78px;
  perspective:900px;
}
.logo-cyl-stage{
  width:100%; height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 1.6s cubic-bezier(.4,0,.2,1);
}
.logo-face{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  backface-visibility:hidden;
}
.logo-face img{
  max-width:92%; max-height:92%; object-fit:contain;
  filter:drop-shadow(0 2px 5px rgba(30,39,97,0.18));
}
@media (max-width:700px){
  #logobar{right:10px; top:calc(8px + env(safe-area-inset-top,0px));}
  .logo-cyl{width:52px; height:52px;}
}

/* ---------- Slide viewport ---------- */
#stage{
  flex:1;
  position:relative;
  overflow:hidden;
}
.slide{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:stretch;
  padding:70px 60px 90px 60px;
  opacity:0;
  transform:translateX(24px);
  transition:opacity .35s ease, transform .35s ease;
  pointer-events:none;
  overflow-y:auto;
  background:var(--white);
}
body.scrubbing .slide{ transition:none !important; }
.slide.active{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}
.slide.dark{background:linear-gradient(160deg, var(--ice-soft) 0%, #FFFFFF 60%); color:var(--text-dark);}
.slide.dark .kicker{color:var(--gold);}
.slide.dark h1.stitle{color:var(--navy);}
.slide.dark h2.ssub{color:var(--navy);}
@media (max-width:700px){
  .slide{padding:60px 20px 100px 20px;}
}

.kicker{
  color:var(--gold);
  font-weight:700;
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:6px;
}
h1.stitle{
  font-family:Georgia,'Times New Roman',serif;
  color:var(--navy);
  font-size:34px;
  margin:0 0 18px 0;
  font-weight:700;
}
h2.ssub{
  font-family:Georgia,'Times New Roman',serif;
  color:var(--navy);
  font-size:22px;
  margin:0 0 14px 0;
}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start;}
@media (max-width:900px){.grid2{grid-template-columns:1fr;}}

ul.bullets{margin:0; padding-left:20px;}
ul.bullets li{margin-bottom:10px; line-height:1.45; font-size:16px;}

.codebox{
  background:var(--navy-dark);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  margin:14px 0;
}
.codebox .cb-head{
  background:rgba(0,0,0,0.35);
  color:var(--gold);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  padding:8px 14px;
}
.codebox pre{
  margin:0;
  padding:14px 18px;
  color:var(--ice-soft);
  font-family:'Courier New', monospace;
  font-size:15px;
  line-height:1.6;
  white-space:pre-wrap;
}
.codebox pre .ln{
  display:block;
  padding:2px 6px;
  border-radius:4px;
}
.codebox pre .ln.hl{
  background:rgba(201,150,43,0.28);
  box-shadow:inset 3px 0 0 var(--gold);
}

.callout{
  background:var(--ice-soft);
  border-radius:10px;
  padding:14px 18px;
  font-size:14px;
  color:var(--navy);
  font-style:italic;
  margin-top:14px;
}
.pill{
  display:inline-block;
  background:var(--gold-soft);
  color:var(--navy-dark);
  font-weight:700;
  font-size:12.5px;
  padding:6px 14px;
  border-radius:999px;
  margin-top:10px;
}

/* ---------- Formula diagram ---------- */
.formula{display:flex; align-items:stretch; gap:10px; margin:16px 0; flex-wrap:wrap;}
.fbox{
  border-radius:10px;
  padding:12px 16px;
  min-width:120px;
  text-align:center;
}
.fbox .flabel{font-size:10.5px; font-weight:700; letter-spacing:0.5px; opacity:0.85;}
.fbox .fval{font-family:'Courier New',monospace; font-size:18px; font-weight:700; margin-top:4px;}
.fbox.seg{background:var(--navy); color:var(--white);}
.fbox.off{background:var(--ice); color:var(--navy);}
.fbox.pa{background:var(--gold); color:var(--navy-dark);}
.fop{display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--muted); font-size:15px; padding:0 4px;}

/* ---------- Nav ---------- */
#navbar{
  position:fixed;
  bottom:0; left:0; right:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 22px calc(10px + env(safe-area-inset-bottom,0px)) 22px;
  background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
}
.navbtn{
  background:var(--navy);
  color:var(--white);
  border:none;
  border-radius:999px;
  padding:10px 20px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:0 3px 10px rgba(0,0,0,0.3);
}
.navbtn:disabled{opacity:0.35; cursor:default;}
.navbtn.gold{background:var(--gold); color:var(--navy-dark);}
#progress{
  color:var(--white);
  font-size:12.5px;
  font-weight:700;
  background:rgba(255,255,255,0.12);
  padding:6px 14px;
  border-radius:999px;
}

/* ---------- Side ruler: drag/swipe slide scrubber ---------- */
#sideRuler{
  position:fixed; right:14px; top:50%; transform:translateY(-50%);
  z-index:120; height:min(64vh, 520px); display:flex; align-items:center;
}
#rulerTrack{
  position:relative; width:8px; height:100%;
  background:rgba(30,39,97,0.14); border-radius:999px; cursor:pointer;
  touch-action:none;
}
#rulerThumb{
  position:absolute; left:50%; top:0%; transform:translate(-50%,-50%);
  width:18px; height:46px; background:var(--navy); border-radius:999px;
  box-shadow:0 3px 10px rgba(30,39,97,0.35); cursor:grab; touch-action:none;
  transition:background .15s ease;
}
#rulerThumb:active{ cursor:grabbing; background:var(--gold); }
#rulerThumb::before{
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:8px; height:2px; background:rgba(255,255,255,0.7); border-radius:2px;
  box-shadow:0 5px 0 rgba(255,255,255,0.7), 0 -5px 0 rgba(255,255,255,0.7);
}
#rulerTooltip{
  position:fixed; right:32px; top:50%;
  background:var(--navy); color:#fff; padding:5px 12px; border-radius:8px; font-size:12.5px; font-weight:700;
  white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s ease;
  transform:translateY(-50%);
  z-index:121;
}
#rulerTooltip.visible{ opacity:1; }
@media (max-width:700px){
  #sideRuler{ right:6px; height:min(50vh, 420px); }
  #rulerThumb{ width:22px; height:40px; }
}

/* ---------- Q&A recap (Ali intro) ---------- */
.qa-card{
  background:var(--ice-soft);
  border-radius:16px;
  padding:34px 40px;
  max-width:820px;
  margin:0 auto;
}
.qa-q{font-size:20px; font-weight:700; color:var(--navy); margin-bottom:18px;}
.qa-a{font-size:17px; color:var(--text-dark); line-height:1.5; display:none;}
.qa-a.shown{display:block;}
.revealbtn{
  background:var(--gold); color:var(--navy-dark); border:none; border-radius:999px;
  padding:10px 22px; font-weight:700; cursor:pointer; font-size:14px;
}

/* ---------- Q&A recap grid (all 5 in one slide) ---------- */
.qa-mini-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;
}
.qa-mini-card{
  background:var(--ice-soft); border-radius:12px; padding:16px 18px;
}
.qa-mini-card:last-child:nth-child(odd){ grid-column: 1 / -1; }
.qa-mini-kicker{ color:var(--gold); font-weight:800; font-size:11px; letter-spacing:1px; margin-bottom:4px; }
.qa-mini-q{ font-size:14.5px; font-weight:700; color:var(--navy); margin-bottom:10px; line-height:1.35; }
.qa-mini-btn{ font-size:12px; padding:6px 14px; }
.qa-mini-a{ font-size:13px; color:var(--text-dark); line-height:1.45; display:none; margin-top:10px; }
.qa-mini-a.shown{ display:block; }
.qa-mini-a ul{ margin:0; padding-left:16px; }
.qa-mini-a li{ margin-bottom:4px; }
@media (max-width:900px){
  .qa-mini-grid{ grid-template-columns:1fr; }
  .qa-mini-card:last-child:nth-child(odd){ grid-column:auto; }
}

/* ---------- Collaborative fill-in ---------- */
.collab-box{
  background:var(--navy-dark);
  border-radius:12px;
  padding:20px 24px;
  color:var(--ice-soft);
}
.collab-step{
  display:flex; align-items:center; gap:10px;
  font-family:'Courier New',monospace; font-size:15px;
  padding:6px 0; opacity:0.4;
}
.collab-step.active{opacity:1;}
.collab-step .blank{
  background:rgba(255,255,255,0.08);
  border:1px dashed var(--gold);
  border-radius:6px;
  padding:2px 14px;
  color:var(--gold);
  font-weight:700;
}
.collab-step.revealed .blank{border-style:solid; background:rgba(201,150,43,0.18);}
.collab-controls{margin-top:14px; display:flex; gap:10px;}
.smallbtn{
  background:var(--gold); color:var(--navy-dark); border:none; border-radius:8px;
  padding:8px 16px; font-weight:700; cursor:pointer; font-size:13px;
}
.smallbtn.secondary{background:rgba(255,255,255,0.15); color:var(--white);}

/* ---------- Simulator ---------- */
.sim{
  background:var(--navy-dark);
  border-radius:14px;
  padding:18px;
  color:var(--ice-soft);
}
.sim-code pre{margin:0; font-family:'Courier New',monospace; font-size:14px; line-height:1.7;}
.sim-code .ln{display:block; padding:2px 8px; border-radius:4px;}
.sim-code .ln.cur{background:rgba(201,150,43,0.3); box-shadow:inset 3px 0 0 var(--gold);}
.sim-panels{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;}
.sim-panel{background:rgba(255,255,255,0.05); border-radius:10px; padding:10px 14px; flex:1; min-width:180px;}
.sim-panel h4{margin:0 0 8px 0; font-size:11px; letter-spacing:1px; color:var(--gold); text-transform:uppercase;}
.sim-reg{display:flex; justify-content:space-between; font-family:'Courier New',monospace; font-size:13px; padding:2px 0;}
.sim-reg .v{font-weight:700;}
.sim-reg.changed .v{color:var(--gold);}
.fd-reveal{transition:opacity .35s ease;}
.sim-ctrl{display:flex; gap:8px; margin-top:12px;}

/* ---------- Quiz ---------- */
.quiz-opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
@media (max-width:700px){.quiz-opts{grid-template-columns:1fr;}}
.qopt{
  background:var(--ice-soft); border:2px solid transparent; border-radius:10px;
  padding:14px 16px; cursor:default; font-size:15px; font-weight:600; color:var(--navy);
  transition:all .15s ease;
}
.qopt.correct{background:#DEF7E4; border-color:var(--ok); color:#136B33;}
.qr-hint{
  display:flex; align-items:center; gap:14px; background:var(--gold-soft); border-radius:10px;
  padding:12px 18px; margin-top:16px; font-size:13px; color:var(--navy-dark); font-weight:600;
}
.qr-real{width:150px;height:150px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px; box-shadow:0 2px 8px rgba(0,0,0,0.15); flex-shrink:0;}
.qr-real img{width:100%;height:100%;}
.qr-real-lg{width:260px;height:260px;padding:10px;}
.quiz-wait{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:var(--ice-soft); border-radius:10px; padding:14px 18px; margin-top:14px;
}
.results-bar-row{display:flex; align-items:center; gap:10px; margin:10px 0;}
.results-bar-row .rlabel{width:220px; font-size:13.5px; font-weight:600;}
.results-bar-track{flex:1; background:rgba(255,255,255,0.12); border-radius:999px; height:18px; overflow:hidden;}
.results-bar-fill{height:100%; background:var(--bad); border-radius:999px; transition:width .6s ease;}
.results-bar-fill.correctfill{background:var(--ok);}
.results-pct{width:50px; text-align:right; font-weight:700; font-size:13.5px;}
.results-meta{font-size:13px; color:var(--muted); margin-top:8px; font-weight:600;}

/* ---------- Evaluation stations ---------- */
.stars{display:flex; gap:10px; justify-content:center; margin:22px 0;}
.star{
  width:56px; height:56px; border-radius:50%; border:2px solid var(--gold);
  background:transparent; color:var(--gold); font-weight:700; font-size:20px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.star.sel{background:var(--gold); color:var(--navy-dark);}
.namefield{
  display:block; margin:0 auto 18px auto; max-width:340px; width:100%;
  padding:12px 16px; border-radius:10px; border:1px solid var(--ice); font-size:15px;
}
.center-narrow{max-width:640px; margin:0 auto; text-align:center;}

.badge-count{font-size:12px; color:var(--muted); margin-top:6px;}

/* ---------- Mobile "respond on your phone" view ---------- */
#respondRoot{
  position:fixed; inset:0; z-index:200;
  background:linear-gradient(160deg, var(--ice-soft) 0%, #FFFFFF 60%);
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  overflow-y:auto;
}
.respond-card{
  background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(30,39,97,0.18);
  padding:30px 26px; max-width:440px; width:100%;
}
.respond-card.rtl{direction:rtl; text-align:right; font-family:'Segoe UI', Tahoma, Arial, sans-serif;}
.respond-kicker{color:var(--gold); font-weight:700; font-size:12.5px; letter-spacing:1px; margin-bottom:6px;}
.respond-title{color:var(--navy); font-size:22px; font-weight:700; margin-bottom:14px; font-family:Georgia,serif;}
.respond-items{margin:0 0 18px 0; padding-inline-start:20px; color:var(--text-dark); font-size:14px; line-height:1.7;}
.respond-stars{display:flex; gap:12px; justify-content:center; margin:20px 0;}
.respond-name{width:100%; padding:13px 16px; border-radius:10px; border:1px solid var(--ice); font-size:15px; margin-bottom:16px;}
.respond-submit{width:100%; background:var(--gold); color:var(--navy-dark); border:none; border-radius:12px; padding:14px; font-weight:700; font-size:16px; cursor:pointer;}
.respond-thanks{text-align:center; padding:30px 10px;}
.respond-thanks .big{font-size:44px; margin-bottom:10px;}
.respond-quiz-opt{
  background:var(--ice-soft); border:2px solid transparent; border-radius:10px; padding:14px 16px;
  margin-bottom:10px; font-size:15px; font-weight:600; color:var(--navy); cursor:pointer;
}
.respond-quiz-opt.correct{background:#DEF7E4; border-color:var(--ok); color:#136B33;}
.respond-quiz-opt.wrong{background:#FBE4E1; border-color:var(--bad); color:#8C2E22;}
@media print {
  #navbar, #logobar { display:none !important; }
  .no-print { display:none !important; }
  body { background:#fff !important; }
  #respondRoot { position:static !important; }
}

/* ---------- Celebration confetti (final slide) ---------- */
#confettiRoot{
  position:fixed; inset:0; pointer-events:none; z-index:150; overflow:hidden;
}
.confetti-piece{
  position:absolute; top:-24px; border-radius:2px;
  animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  opacity:0.95;
}
.fire-piece{
  position:absolute; top:-40px; line-height:1;
  animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  opacity:0.95;
}
@keyframes confettiFall{
  0%{ transform:translateY(0) rotate(var(--rot0,0deg)); }
  100%{ transform:translateY(118vh) rotate(calc(var(--rot0,0deg) + 900deg)); }
}
.clap-row{ display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; transition:opacity .8s ease; }
.clap-row.fading{ opacity:0; pointer-events:none; }
.clap-emoji{ font-size:30px; display:inline-block; animation:clapBounce 1.1s ease-in-out infinite; }
.clap-emoji:nth-child(2){ animation-delay:0.12s; }
.clap-emoji:nth-child(4){ animation-delay:0.24s; }
.clap-emoji:nth-child(5){ animation-delay:0.36s; }
@keyframes clapBounce{
  0%,100%{ transform:translateY(0) rotate(0deg); }
  50%{ transform:translateY(-10px) rotate(-8deg); }
}
.cool-emoji{ display:inline-block; margin-left:6px; font-size:30px; line-height:1; vertical-align:middle; }
.happy-emoji{ animation:happyPulse 0.9s ease-in-out infinite; transform-origin:center; }
@keyframes happyPulse{
  0%,100%{ transform:scale(1) rotate(0deg); }
  50%{ transform:scale(1.2) rotate(-8deg); }
}
.angry-emoji{ animation:angryShake 0.45s ease-in-out infinite; transform-origin:center; }
@keyframes angryShake{
  0%,100%{ transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 0px rgba(255,0,0,0)); }
  25%{ transform:scale(1.1) rotate(-10deg); filter:drop-shadow(0 0 4px rgba(255,0,0,0.55)); }
  50%{ transform:scale(1.2) rotate(9deg); filter:drop-shadow(0 0 7px rgba(255,0,0,0.75)); }
  75%{ transform:scale(1.3) rotate(-12deg); filter:drop-shadow(0 0 10px rgba(255,0,0,0.9)); }
}
.gun-emoji{ font-size:30px; position:relative; display:inline-block; animation:gunKick 0.35s ease-in-out infinite; }
.bullet{ position:absolute; top:50%; right:100%; font-size:13px; opacity:0; animation:bulletFly 0.55s linear infinite; }
.bullet:nth-child(2){ animation-delay:0.14s; }
.bullet:nth-child(3){ animation-delay:0.28s; }
@keyframes gunKick{ 0%,100%{ transform:translateX(0) rotate(0deg); } 50%{ transform:translateX(2px) rotate(-4deg); } }
@keyframes bulletFly{
  0%{ transform:translate(0,-50%); opacity:1; }
  100%{ transform:translate(-46px,-50%); opacity:0; }
}
.pdf-box{
  display:none; align-items:center; gap:14px; background:#fff; border-radius:14px; padding:14px 22px;
  margin:22px auto 0 auto; box-shadow:0 6px 20px rgba(30,39,97,0.14); max-width:420px;
  opacity:0;
}
.pdf-box.visible{ display:flex; animation:fadeInUp .6s ease forwards; }
@keyframes fadeInUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>
<body>
<div id="app">
  <div id="logobar">
    <div class="logo-cyl">
      <div class="logo-cyl-stage" id="logoCylStage">
        <div class="logo-face" id="faceMinistry"><img alt="Ministry of Higher Education"></div>
        <div class="logo-face" id="faceUniversity"><img alt="Al-Iraqia University"></div>
        <div class="logo-face" id="faceCollege"><img alt="College of Engineering"></div>
      </div>
    </div>
  </div>
  <div id="stage"></div>
  <div id="sideRuler">
    <div id="rulerTrack">
      <div id="rulerThumb"></div>
    </div>
    <div id="rulerTooltip"></div>
  </div>
  <div id="navbar">
    <button class="navbtn" id="btnPrev">&#8592; Previous</button>
    <div id="progress">1 / 1</div>
    <button class="navbtn gold" id="btnNext">Next &#8594;</button>
  </div>
</div>
<div id="respondRoot" style="display:none;"></div>
<div id="confettiRoot"></div>

    document.getElementById('faceMinistry'),
    document.getElementById('faceUniversity'),
    document.getElementById('faceCollege')
  ];
  faces.forEach((f,i)=>{
    f.style.transform = `rotateY(${i*120}deg) translateZ(${radius}px)`;
  });
  let angle = 0;
  function spin(){
    angle -= 120;
    stage.style.transform = `rotateY(${angle}deg)`;
  }
  spin(); // settle to first face facing forward
  setInterval(spin, 6500);
})();

// FLOW DIAGRAMS \u2014 register/adder/memory block diagrams, in the same
// visual language as the course's original lecture notes.
// ====================================================================
const FD = {
  NAVY:'#1E2761', GOLD:'#C9962B', ICE:'#CADCFC', MUTED:'#5B6288', TEXT:'#1B1F3B', WHITE:'#FFFFFF', ICES:'#EBF1FD',
  box(x,y,w,h,label,value,opts={}){
    const fill = opts.fill||this.ICES, stroke=opts.stroke||this.NAVY, tcol=opts.textColor||this.NAVY;
    const hasSub = !!opts.sub;
    const labelY = y+14;
    const valueY = hasSub ? y+h-20 : y+h/2+6;
    const subY = y+h-6;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.6"/>
      <text x="${x+w/2}" y="${labelY}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${tcol}" font-family="Calibri,Arial">${esc(label)}</text>
      <text x="${x+w/2}" y="${valueY}" text-anchor="middle" font-size="14" font-weight="700" fill="${tcol}" font-family="Courier New,monospace">${esc(value)}</text>
      ${hasSub?`<text x="${x+w/2}" y="${subY}" text-anchor="middle" font-size="8.5" fill="${this.MUTED}" font-family="Calibri,Arial">${esc(opts.sub)}</text>`:''}`;
  },
  adder(cx,cy){
    return `<circle cx="${cx}" cy="${cy}" r="13" fill="${this.WHITE}" stroke="${this.NAVY}" stroke-width="2"/>
      <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="700" fill="${this.NAVY}">+</text>`;
  },
  hArrow(x1,y,x2,color){
    color = color||this.MUTED;
    const dir = x2>x1?1:-1;
    const tipX = x2, tipY=y;
    const backX = tipX - dir*8;
    return `<line x1="${x1}" y1="${y}" x2="${backX}" y2="${y}" stroke="${color}" stroke-width="1.8"/>
      <polygon points="${tipX},${tipY} ${backX},${tipY-4.5} ${backX},${tipY+4.5}" fill="${color}"/>`;
  },
  vArrow(x,y1,y2,color){
    color = color||this.MUTED;
    const dir = y2>y1?1:-1;
    const tipY = y2, tipX=x;
    const backY = tipY - dir*8;
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${backY}" stroke="${color}" stroke-width="1.8"/>
      <polygon points="${tipX},${tipY} ${tipX-4.5},${backY} ${tipX+4.5},${backY}" fill="${color}"/>`;
  },
  elbow(x1,y1,x2,y2,color){ // vertical then horizontal, arrow at end
    color = color||this.MUTED;
    return `<polyline points="${x1},${y1} ${x1},${y2} ${x2-8},${y2}" fill="none" stroke="${color}" stroke-width="1.8"/>
      ${this.hArrow(x2-8,y2,x2,color)}`;
  },
  memBlock(x,y,cells,opts={}){
    // cells: [{addr, value}] drawn as stacked cells; address label placed BELOW each cell (never on the arrow path)
    const w=64, ch=30;
    let out = `<text x="${x+w/2}" y="${y-8}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${this.NAVY}">MEMORY</text>`;
    cells.forEach((c,i)=>{
      const cy = y + i*(ch+16);
      out += `<rect x="${x}" y="${cy}" width="${w}" height="${ch}" fill="${this.WHITE}" stroke="${this.NAVY}" stroke-width="1.4"/>
        <text x="${x+w/2}" y="${cy+ch/2+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${this.NAVY}" font-family="Courier New,monospace">${esc(c.value)}</text>
        <text x="${x+w/2}" y="${cy+ch+12}" text-anchor="middle" font-size="9.5" fill="${this.MUTED}" font-family="Courier New,monospace">${esc(c.addr)}</text>`;
    });
    return out;
  },
  defs(){
    return `<defs></defs>`;
  }
};

// Builds a full load-direction diagram: segReg (+ offset parts chained through adders) -> PA -> memory -> destReg
// Now step-aware: each element only lights up once the step that sets it has been reached (cfg.effects is reused
// from the same stepper config, so no extra bookkeeping is needed at the call site).
function fdWrap(step, inner){
  return `<g data-step="${step}" class="fd-reveal">${inner}</g>`;
}
function fdFindStep(effects, regName){
  if(!regName) return -1; // literal value, embedded in the instruction itself -> always visible
  let found = -1;
  for(let i=0;i<effects.length;i++){
    if(effects[i] && effects[i].regs && (regName in effects[i].regs)) found = i; // keep the LAST assignment, not the first
  }
  return found;
}
function diagramLoad(cfg){
  // cfg: {w, instruction, segReg:{label,value,sub}, parts:[{label,value,sub}], cells:[{addr,value}], dest:{label,value}, effects}
  const parts = cfg.parts;
  const effects = cfg.effects || [];
  const accessStep = effects.length ? effects.length-1 : -1;
  const boxW=80, boxH=52, gapY=64;
  const leftX = 24;
  const nBoxes = 1+parts.length; // segReg + parts
  const totalH = Math.max(190, nBoxes*gapY + 40);
  const w = cfg.w || (430 + parts.length*70);
  const boxYs = [];
  const startY = 46;
  for(let i=0;i<nBoxes;i++) boxYs.push(startY + i*gapY);

  let svg = '';
  svg += `<text x="${leftX}" y="22" font-size="12.5" font-weight="700" fill="${FD.NAVY}" font-family='Courier New,monospace'>${esc(cfg.instruction)}</text>`;

  const boxes = [...parts, cfg.segReg];
  const boxSteps = boxes.map(b => fdFindStep(effects, b.label));
  boxes.forEach((b,i)=>{
    svg += fdWrap(boxSteps[i], FD.box(leftX, boxYs[i], boxW, boxH, b.label||'\u00A0', b.value, {sub: b.sub}));
  });

  let curX = leftX+boxW+46;
  let adderCenters = [];
  let adderSteps = [];
  if(parts.length===1){
    const ay = (boxYs[0]+boxYs[boxYs.length-1])/2 + boxH/2;
    const st = Math.max(boxSteps[0], boxSteps[1]);
    svg += fdWrap(st, FD.elbow(leftX+boxW, boxYs[0]+boxH/2, curX, ay) + FD.elbow(leftX+boxW, boxYs[1]+boxH/2, curX, ay) + FD.adder(curX, ay));
    adderCenters.push({x:curX,y:ay}); adderSteps.push(st);
    curX += 46;
  } else {
    let prevX = null, prevY = null, prevStep = -1;
    for(let i=0;i<parts.length-1;i++){
      const ay = (boxYs[i]+boxYs[i+1])/2 + boxH/2;
      const st = i===0 ? Math.max(boxSteps[i], boxSteps[i+1]) : Math.max(prevStep, boxSteps[i+1]);
      let wires = '';
      if(i===0){ wires = FD.elbow(leftX+boxW, boxYs[i]+boxH/2, curX, ay) + FD.elbow(leftX+boxW, boxYs[i+1]+boxH/2, curX, ay); }
      else { wires = FD.elbow(prevX+13, prevY, curX, ay) + FD.elbow(leftX+boxW, boxYs[i+1]+boxH/2, curX, ay); }
      svg += fdWrap(st, wires + FD.adder(curX, ay));
      adderCenters.push({x:curX,y:ay}); adderSteps.push(st);
      prevX = curX; prevY = ay; prevStep = st;
      curX += 46;
    }
    const segY = boxYs[boxYs.length-1]+boxH/2;
    const finalY = (prevY + segY)/2;
    const finalSt = Math.max(prevStep, boxSteps[boxSteps.length-1]);
    svg += fdWrap(finalSt, FD.elbow(prevX+13, prevY, curX, finalY) + FD.elbow(leftX+boxW, segY, curX, finalY) + FD.adder(curX, finalY));
    adderCenters.push({x:curX,y:finalY}); adderSteps.push(finalSt);
    curX += 46;
  }
  const lastAdder = adderCenters[adderCenters.length-1];
  const paStep = Math.max(adderSteps[adderSteps.length-1], accessStep);

  const memX = curX+26;
  const memY = lastAdder.y - 15;
  svg += fdWrap(paStep, FD.hArrow(lastAdder.x+13, lastAdder.y, memX-2, FD.NAVY) + FD.memBlock(memX, memY, cfg.cells));

  const cellCenterY = memY + 15;
  const destX = memX+64+58;
  const destY = cellCenterY - boxH/2;
  svg += fdWrap(accessStep, FD.hArrow(memX+64+2, cellCenterY, destX-2, FD.GOLD) + FD.box(destX, destY, boxW, boxH, cfg.dest.label, cfg.dest.value, {fill:'#F3E6C8', stroke:FD.GOLD, textColor:'#8a6412'}));

  const totalW = destX+boxW+20;
  const dy = 14;
  const totalHeight = Math.max(totalH, memY + cfg.cells.length*46 + 20) + dy;
  return `<svg viewBox="0 0 ${totalW} ${totalHeight}" style="width:100%; height:auto; max-height:270px;"><g transform="translate(0,${dy})">${svg}</g></svg>`;
}

// Store-direction diagram: source register -> memory (reversed arrow), still shows PA computation
function diagramStore(cfg){
  const parts = cfg.parts;
  const effects = cfg.effects || [];
  const accessStep = effects.length ? effects.length-1 : -1;
  const boxW=80, boxH=52, gapY=64;
  const leftX = 24;
  const nBoxes = 1+parts.length;
  const startY = 46;
  const boxYs = []; for(let i=0;i<nBoxes;i++) boxYs.push(startY+i*gapY);
  const totalH = Math.max(190, nBoxes*gapY+40);

  let svg = '';
  svg += `<text x="${leftX}" y="22" font-size="12.5" font-weight="700" fill="${FD.NAVY}" font-family='Courier New,monospace'>${esc(cfg.instruction)}</text>`;
  const boxes=[...parts, cfg.segReg];
  const boxSteps = boxes.map(b => fdFindStep(effects, b.label));
  boxes.forEach((b,i)=>{ svg += fdWrap(boxSteps[i], FD.box(leftX, boxYs[i], boxW, boxH, b.label||'\u00A0', b.value, {sub:b.sub})); });

  let curX = leftX+boxW+46;
  let adderCenters=[]; let adderSteps=[];
  if(parts.length===1){
    const ay=(boxYs[0]+boxYs[1])/2+boxH/2;
    const st = Math.max(boxSteps[0], boxSteps[1]);
    svg += fdWrap(st, FD.elbow(leftX+boxW, boxYs[0]+boxH/2, curX, ay) + FD.elbow(leftX+boxW, boxYs[1]+boxH/2, curX, ay) + FD.adder(curX, ay));
    adderCenters.push({x:curX,y:ay}); adderSteps.push(st);
    curX+=46;
  } else {
    let prevX=null, prevY=null, prevStep=-1;
    for(let i=0;i<parts.length-1;i++){
      const ay=(boxYs[i]+boxYs[i+1])/2+boxH/2;
      const st = i===0 ? Math.max(boxSteps[i], boxSteps[i+1]) : Math.max(prevStep, boxSteps[i+1]);
      let wires = '';
      if(i===0){ wires = FD.elbow(leftX+boxW, boxYs[i]+boxH/2, curX, ay) + FD.elbow(leftX+boxW, boxYs[i+1]+boxH/2, curX, ay); }
      else { wires = FD.elbow(prevX+13, prevY, curX, ay) + FD.elbow(leftX+boxW, boxYs[i+1]+boxH/2, curX, ay); }
      svg += fdWrap(st, wires + FD.adder(curX, ay));
      adderCenters.push({x:curX,y:ay}); adderSteps.push(st);
      prevX=curX; prevY=ay; prevStep=st; curX+=46;
    }
    const segY=boxYs[boxYs.length-1]+boxH/2;
    const finalY=(prevY+segY)/2;
    const finalSt = Math.max(prevStep, boxSteps[boxSteps.length-1]);
    svg += fdWrap(finalSt, FD.elbow(prevX+13, prevY, curX, finalY) + FD.elbow(leftX+boxW, segY, curX, finalY) + FD.adder(curX, finalY));
    adderCenters.push({x:curX,y:finalY}); adderSteps.push(finalSt);
    curX+=46;
  }
  const lastAdder = adderCenters[adderCenters.length-1];
  const paStep = Math.max(adderSteps[adderSteps.length-1], accessStep);
  const memX = curX+26;
  const memY = lastAdder.y-15;
  svg += fdWrap(paStep, FD.hArrow(lastAdder.x+13, lastAdder.y, memX-2, FD.NAVY) + FD.memBlock(memX, memY, cfg.cells));

  // source register ABOVE, arrow going DOWN then INTO memory (store direction)
  const srcX = memX+10;
  const srcY = 14;
  const srcStep = fdFindStep(effects, cfg.dest.label);
  svg += fdWrap(srcStep, FD.box(srcX, srcY, boxW, boxH, cfg.dest.label, cfg.dest.value, {fill:'#F3E6C8', stroke:FD.GOLD, textColor:'#8a6412'}));
  svg += fdWrap(accessStep, FD.vArrow(srcX+boxW/2, srcY+boxH, memY-20, FD.GOLD));

  const totalW = memX+64+70;
  const dy = 14;
  const totalHeight = Math.max(totalH, memY+cfg.cells.length*46+20) + dy;
  return `<svg viewBox="0 0 ${totalW} ${totalHeight}" style="width:100%; height:auto; max-height:270px;"><g transform="translate(0,${dy})">${svg}</g></svg>`;
}

function diagramPort(cfg){

const STEP = {};
function lineHTML(raw, revealed){
  return raw.replace(/\{\{B:(.*?)\}\}/g, (m,inner)=> revealed ? `<b style="color:var(--gold);">${esc(inner)}</b>` : `<span class="blank">?????</span>`);
}
function renderStepper(s){
  STEP[s.id] = {cfg:s, idx:-1};
  const panels = (s.regsShown.length||s.memShown.length||s.flagsShown.length) ? `
    <div class="sim-panels">
      ${s.regsShown.length?`<div class="sim-panel"><h4>Registers</h4><div id="${s.id}_regs"></div></div>`:''}
      ${s.memShown.length?`<div class="sim-panel"><h4>Memory</h4><div id="${s.id}_mem"></div></div>`:''}
      ${s.flagsShown.length?`<div class="sim-panel"><h4>Flags</h4><div id="${s.id}_flags"></div></div>`:''}
    </div>` : '';
  return `
  <div class="slide active-fill">
    <div class="kicker">${esc(s.kicker)}</div>
    <h1 class="stitle">${esc(s.title)}</h1>
    ${s.note?`<div class="callout" style="margin-top:0; margin-bottom:14px;">${s.note}</div>`:''}
    ${s.promptCollab?`<div class="callout" style="margin-top:0; margin-bottom:14px; background:var(--gold-soft); color:var(--navy);">\uD83D\uDCAC ${s.promptCollab}</div>`:''}
    <div class="sim">
      <div class="sim-code"><pre id="${s.id}_code"></pre></div>
      ${panels}
      <div class="sim-ctrl">
        <button class="smallbtn secondary" onclick="STEPFN.prev('${s.id}')">&#8592; Prev</button>
        <button class="smallbtn" onclick="STEPFN.next('${s.id}')">${s.mode==='collab'?'Reveal Next Step':'Next Step'} &#8594;</button>
        <button class="smallbtn secondary" onclick="STEPFN.reset('${s.id}')">Reset</button>
        <span class="badge-count" id="${s.id}_prog" style="margin-left:auto; color:var(--ice);"></span>
      </div>
    </div>
    ${s.diagram?`<div id="${s.id}_diagram" style="margin-top:16px; background:#fff; border:1px solid var(--ice); border-radius:12px; padding:14px 10px; ${s.mode==='collab'?'display:none;':''}">${s.diagram}</div>`:''}
    ${(s.mode==='collab' && s.diagram)?`<div class="callout" id="${s.id}_diaghint" style="background:var(--gold-soft); color:var(--navy-dark); font-style:normal;">\uD83D\uDD12 The diagram will appear once every blank has been revealed.</div>`:''}
    ${(!s.diagram && s.formula)?`<div style="margin-top:16px;">${formulaHTML(s.formula.segLabel,s.formula.segVal,s.formula.offLabel,s.formula.offVal,s.formula.paVal)}</div>`:''}
    ${s.explanation?`<div class="callout">${s.explanation}</div>`:''}
  </div>`;
}
const STEPFN = {
  _cumulative(cfg, idx){
    const regs={}, mem={}, flags={};
    for(let i=0;i<=idx;i++){
      const e = cfg.effects[i];
      if(!e) continue;
      if(e.regs) Object.assign(regs, e.regs);
      if(e.mem) Object.assign(mem, e.mem);
      if(e.flags) Object.assign(flags, e.flags);
    }
    return {regs,mem,flags};
  },
  _render(id){
    const st = STEP[id]; const cfg = st.cfg; const idx = st.idx;
    const codeEl = document.getElementById(id+'_code');
    codeEl.innerHTML = cfg.lines.map((l,i)=>{
      const revealed = (cfg.mode!=='collab') || (i<=idx);
      const cls = i<idx?'ln done':i===idx?'ln cur':'ln pending';
      const opacity = (!revealed && i>idx) ? 'style="opacity:.45"' : '';
      return `<span class="${cls}" ${opacity}>${lineHTML(esc(l.text).replace(/\{\{B:(.*?)\}\}/g,'{{B:$1}}'), revealed)}</span>`;
    }).join('\n');
    const cum = STEPFN._cumulative(cfg, idx);
    const changed = idx>=0 && cfg.effects[idx] ? cfg.effects[idx] : {regs:{},mem:{},flags:{}};
    if(cfg.regsShown.length){
      document.getElementById(id+'_regs').innerHTML = cfg.regsShown.map(r=>{
        const v = cum.regs[r] || '\u2014';
        const ch = changed.regs && (r in changed.regs);
        return `<div class="sim-reg${ch?' changed':''}"><span>${r}</span><span class="v">${esc(v)}</span></div>`;
      }).join('');
    }
    if(cfg.memShown.length){
      document.getElementById(id+'_mem').innerHTML = cfg.memShown.map(m=>{
        const v = cum.mem[m] || '\u2014';
        const ch = changed.mem && (m in changed.mem);
        return `<div class="sim-reg${ch?' changed':''}"><span>${m}</span><span class="v">${esc(v)}</span></div>`;
      }).join('');
    }
    if(cfg.flagsShown.length){
      document.getElementById(id+'_flags').innerHTML = cfg.flagsShown.map(f=>{
        const v = cum.flags[f] || '\u2014';
        const ch = changed.flags && (f in changed.flags);
        return `<div class="sim-reg${ch?' changed':''}"><span>${f}</span><span class="v">${esc(v)}</span></div>`;
      }).join('');
    }
    document.getElementById(id+'_prog').textContent = idx<0 ? 'Not started' : `Step ${idx+1} / ${cfg.lines.length}`;

    // collaborative examples: keep the answer diagram hidden until every blank has been revealed
    if(cfg.mode==='collab' && cfg.diagram){
      const dEl = document.getElementById(id+'_diagram');
      const hintEl = document.getElementById(id+'_diaghint');
      const complete = idx === cfg.lines.length-1;
      if(dEl) dEl.style.display = complete ? 'block' : 'none';
      if(hintEl) hintEl.style.display = complete ? 'none' : 'block';
    }

    // interactive diagram: light up each register/adder/memory/destination group the moment
    // its step is reached, so the picture builds up in sync with the code (demo AND collab alike)
    if(cfg.diagram){
      const dEl = document.getElementById(id+'_diagram');
      if(dEl){
        dEl.querySelectorAll('[data-step]').forEach(el=>{
          const st = parseInt(el.getAttribute('data-step'), 10);
          el.style.opacity = (idx >= st) ? '1' : '0.14';
        });
      }
    }
  },
  next(id){ const st=STEP[id]; if(st.idx < st.cfg.lines.length-1){ st.idx++; STEPFN._render(id);} },
  prev(id){ const st=STEP[id]; if(st.idx > -1){ st.idx--; STEPFN._render(id);} },
  reset(id){ STEP[id].idx=-1; STEPFN._render(id); }
};

const QUIZFN = {
  startPolling(id){
    const upd = ()=>{
      if(QUIZ_REVEALED[id]) return;
      const data = LocalPoll.get(id);
      const el = document.getElementById(id+'_waitcount');
      if(el) el.textContent = `${data.total||0} student${data.total===1?'':'s'} have answered so far`;
    };
    upd();
    setInterval(upd, 1500);
  },
  reveal(id){
    if(QUIZ_REVEALED[id]) return;
    QUIZ_REVEALED[id] = true;
    const cfg = SLIDES.find(x=>x.id===id);
    const data = LocalPoll.get(id);
    cfg.options.forEach((o,i)=>{
      const el = document.getElementById(id+'_opt'+i);
      if(i===cfg.correct) el.classList.add('correct');
    });
    const waitEl = document.getElementById(id+'_wait');
    if(waitEl) waitEl.style.display='none';
    QUIZFN._renderResults(id, cfg, data);
  },
  _renderResults(id, cfg, data){
    const total = data.total || 0;
    const correctCount = data.counts[cfg.correct] || 0;
    const pctCorrect = total? Math.round(correctCount/total*100):0;
    const pctWrong = total? 100-pctCorrect:0;
    let html = `<div class="results-meta">${total} student${total!==1?'s':''} answered &nbsp;\u2022&nbsp; <b style="color:var(--ok)">${pctCorrect}% correct</b> &nbsp;\u2022&nbsp; <b style="color:var(--bad)">${pctWrong}% incorrect</b></div>`;
    cfg.options.forEach((o,i)=>{
      const c = data.counts[i]||0;
      const pct = total? Math.round(c/total*100):0;
      html += `<div class="results-bar-row">
        <div class="rlabel">${esc(o)}</div>
        <div class="results-bar-track"><div class="results-bar-fill${i===cfg.correct?' correctfill':''}" style="width:${pct}%;"></div></div>
        <div class="results-pct">${pct}%</div>
      </div>`;
    });
    document.getElementById(id+'_results').innerHTML = html;
  }
};

function computeSpeakerEval(speaker){
  const cats = RUBRIC.map(r=>r.en);
  let catAverages = [];
  let allRatings = [];
  const namesSet = new Set();
  cats.forEach(cat=>{
    const key = 'eval_'+speaker+'_'+cat.replace(/\s+/g,'_');
    const rec = JSON.parse(localStorage.getItem(key)||'{}');
    Object.keys(rec).forEach(n=>namesSet.add(n));
    const vals = Object.values(rec);
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    catAverages.push({cat, avg, n:vals.length});
    allRatings = allRatings.concat(vals);
  });
  const overall = allRatings.length ? allRatings.reduce((a,b)=>a+b,0)/allRatings.length : 0;
  return {overall, catAverages, n: allRatings.length, people: namesSet.size};
}

function computeSpeakerTable(speaker){
  const cats = RUBRIC.map(r=>r.en);
  const perCat = cats.map(cat=>{
    const key = 'eval_'+speaker+'_'+cat.replace(/\s+/g,'_');
    return JSON.parse(localStorage.getItem(key)||'{}');
  });
  const namesSet = new Set();
  perCat.forEach(rec=>Object.keys(rec).forEach(n=>namesSet.add(n)));
  const names = Array.from(namesSet).sort();
  const rows = names.map(name=>{
    const ratings = perCat.map(rec => (rec[name]!==undefined ? rec[name] : null));
    const valid = ratings.filter(r=>r!==null);
    const avg = valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
    return {name, ratings, avg};
  });
  return {cats, rows};
}

// ---------- Side ruler: drag/tap to scrub through slides (no typing needed) ----------
(function(){
  const track = document.getElementById('rulerTrack');
  const thumb = document.getElementById('rulerThumb');
  const tooltip = document.getElementById('rulerTooltip');
  let dragging = false;

  function updateThumbPosition(){
    const ratio = SLIDES.length > 1 ? current/(SLIDES.length-1) : 0;
    thumb.style.top = (ratio*100) + '%';
  }
  window._rulerUpdateThumb = updateThumbPosition;

  function posToIndex(clientY){
    const rect = track.getBoundingClientRect();
    let ratio = (clientY - rect.top) / rect.height;
    ratio = Math.max(0, Math.min(1, ratio));
    return Math.round(ratio * (SLIDES.length-1));
  }
  function positionTooltip(clientY){
    tooltip.style.top = clientY + 'px';
  }
  function showTooltip(idx, clientY){
    const s = SLIDES[idx];
    const label = s && (s.title || s.label) ? `: ${s.title || s.label}` : '';
    tooltip.textContent = `${idx+1} / ${SLIDES.length}${label}`;
    positionTooltip(clientY);
    tooltip.classList.add('visible');
  }
  function hideTooltip(){ tooltip.classList.remove('visible'); }

  function beginDrag(clientY){
    dragging = true;
    document.body.classList.add('scrubbing');
    const idx = posToIndex(clientY);
    if(idx !== current){ current = idx; update(); }
    showTooltip(current, clientY);
  }
  function continueDrag(clientY){
    if(!dragging) return;
    const idx = posToIndex(clientY);
    if(idx !== current){ current = idx; update(); }
    showTooltip(current, clientY);
  }
  function endDrag(){
    dragging = false;
    document.body.classList.remove('scrubbing');
    hideTooltip();
  }

  thumb.addEventListener('pointerdown', (e)=>{ e.preventDefault(); thumb.setPointerCapture(e.pointerId); beginDrag(e.clientY); });
  thumb.addEventListener('pointermove', (e)=>{ if(dragging) continueDrag(e.clientY); });
  thumb.addEventListener('pointerup', endDrag);
  thumb.addEventListener('pointercancel', endDrag);

  track.addEventListener('pointerdown', (e)=>{
    if(e.target===thumb) return;
    track.setPointerCapture(e.pointerId);
    beginDrag(e.clientY);
  });
  track.addEventListener('pointermove', (e)=>{ if(dragging) continueDrag(e.clientY); });
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  updateThumbPosition();
})();

// ---------- Swipe / drag gesture on the slide itself (left = next, right = previous) ----------
(function(){
  const stage = document.getElementById('stage');
  let startX = 0, startY = 0, tracking = false;
  stage.addEventListener('pointerdown', (e)=>{
    tracking = true; startX = e.clientX; startY = e.clientY;
  });
  function finish(e){
    if(!tracking) return;
    tracking = false;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if(dx < 0) document.getElementById('btnNext').click();
      else document.getElementById('btnPrev').click();
    }
  }
  stage.addEventListener('pointerup', finish);
  stage.addEventListener('pointercancel', ()=>{ tracking = false; });
})();

// ====================================================================
// QR CODES \u2014 generate real scannable codes for every quiz & evaluation
// ====================================================================
function respondURL(id){
  return location.href.split('#')[0] + '#respond=' + id;
}
function initQRCodes(){
  SLIDES.forEach(s=>{
    if(s.type==='quiz' || s.type==='evaluation'){
      const el = document.getElementById(s.id+'_qr');
      if(el && window.QRCode){
        const size = s.type==='evaluation' ? 250 : 140;
        new QRCode(el, {text: respondURL(s.id), width:size, height:size, colorDark:'#1E2761', colorLight:'#ffffff'});
      }
    }
  });
}

// ====================================================================
// STUDENT PHONE VIEW \u2014 opened when a QR code is scanned (#respond=<id>)
// ====================================================================
function renderRespondEvaluation(cfg){
  RESPONDEVAL.init(cfg);
  RESPONDEVAL.renderStep();
}
const RESPONDEVAL = {
  cfg:null, idx:0, ratings:{}, name:'',
  init(cfg){
    this.cfg = cfg; this.idx = 0; this.ratings = {};
    this.name = localStorage.getItem('studentName') || '';
  },
  renderStep(){
    const cat = this.cfg.rubric[this.idx];
    const total = this.cfg.rubric.length;
    const isFirst = this.idx===0;
    const isLast = this.idx===total-1;
    const selected = this.ratings[this.idx] || 0;
    const speakerAr = this.cfg.speaker==='ali' ? '\u0639\u0644\u064a \u0627\u0644\u0645\u0631\u062a\u0636\u0649' : '\u0623\u062d\u0645\u062f \u0645\u0635\u0637\u0641\u0649';
    document.getElementById('respondRoot').innerHTML = `
      <div class="respond-card rtl">
        <div class="respond-kicker">\u062a\u0642\u064a\u064a\u0645 ${speakerAr} \u2014 \u0645\u0639\u064a\u0627\u0631 ${this.idx+1} / ${total}</div>
        <div class="respond-title">${esc(cat.arTitle)}</div>
        <p style="font-weight:700; color:var(--navy); font-size:15px;">${esc(cat.arQuestion)}</p>
        <ul class="respond-items">${cat.items.map(it=>`<li>${esc(it)}</li>`).join('')}</ul>
        ${isFirst?`<input type="text" class="respond-name" id="rname_input" placeholder="\u0627\u0633\u0645\u0643 (\u064a\u064f\u0633\u062a\u062e\u062f\u0645 \u0645\u0631\u0629 \u0648\u0627\u062d\u062f\u0629 \u0648\u064a\u064f\u062d\u0641\u0638 \u062a\u0644\u0642\u0627\u0626\u064a\u0627\u064b)" value="${esc(this.name)}">`:''}
        <div class="respond-stars">
          ${[1,2,3,4,5].map(n=>`<button class="star${n<=selected?' sel':''}" id="rstar${n}" onclick="RESPONDEVAL.rate(${n})">${n}</button>`).join('')}
        </div>
        <button class="respond-submit" onclick="RESPONDEVAL.next()">${isLast?'\u0625\u0631\u0633\u0627\u0644 \u0627\u0644\u062a\u0642\u064a\u064a\u0645\u0627\u062a':'\u0627\u0644\u062a\u0627\u0644\u064a \u2192'}</button>
        <div id="rmsg" style="margin-top:12px; font-weight:700; text-align:center; color:var(--bad);"></div>
      </div>`;
  },
  rate(n){
    this.ratings[this.idx] = n;
    for(let i=1;i<=5;i++){ const el=document.getElementById('rstar'+i); if(el) el.classList.toggle('sel', i<=n); }
  },
  next(){
    if(this.idx===0){
      const nameEl = document.getElementById('rname_input');
      const val = nameEl ? nameEl.value.trim() : '';
      this.name = val || this.name;
      if(!this.name){ nameEl.focus(); nameEl.placeholder='\u0627\u0644\u0631\u062c\u0627\u0621 \u0625\u062f\u062e\u0627\u0644 \u0627\u0633\u0645\u0643 \u0623\u0648\u0644\u0627\u064b'; return; }
    }
    if(!this.ratings[this.idx]){
      document.getElementById('rmsg').textContent = '\u0627\u0644\u0631\u062c\u0627\u0621 \u0627\u062e\u062a\u064a\u0627\u0631 \u062a\u0642\u064a\u064a\u0645 \u0645\u0646 1 \u0625\u0644\u0649 5.';
      return;
    }
    const total = this.cfg.rubric.length;
    if(this.idx < total-1){ this.idx++; this.renderStep(); }
    else { this.submitAll(); }
  },
  submitAll(){
    localStorage.setItem('studentName', this.name);
    this.cfg.rubric.forEach((cat,i)=>{
      const key = 'eval_'+this.cfg.speaker+'_'+cat.en.replace(/\s+/g,'_');
      let rec = JSON.parse(localStorage.getItem(key)||'{}');
      rec[this.name] = this.ratings[i];
      localStorage.setItem(key, JSON.stringify(rec));
    });
    const speakerAr = this.cfg.speaker==='ali' ? '\u0639\u0644\u064a' : '\u0623\u062d\u0645\u062f';
    document.getElementById('respondRoot').innerHTML = `
      <div class="respond-card rtl">
        <div class="respond-thanks">
          <div class="big">\u2705</div>
          <div class="respond-title">\u0634\u0643\u0631\u0627\u064b \u0644\u0643 ${esc(this.name)}!</div>
          <p style="color:var(--muted); font-size:14px;">\u062a\u0645 \u062a\u0633\u062c\u064a\u0644 \u062a\u0642\u064a\u064a\u0645\u0627\u062a\u0643 \u0627\u0644\u062e\u0645\u0633\u0629 \u0644\u0623\u062f\u0627\u0621 ${speakerAr} \u0628\u0646\u062c\u0627\u062d.</p>
          <p style="color:var(--muted); font-size:13px; margin-top:18px;">\u064a\u0645\u0643\u0646\u0643 \u0627\u0644\u0622\u0646 \u0625\u063a\u0644\u0627\u0642 \u0647\u0630\u0647 \u0627\u0644\u0635\u0641\u062d\u0629 \u0648\u0627\u0644\u0639\u0648\u062f\u0629 \u0644\u0645\u062a\u0627\u0628\u0639\u0629 \u0627\u0644\u0639\u0631\u0636.</p>
        </div>
      </div>`;
  }
};
function renderRespondQuiz(cfg){
  document.getElementById('respondRoot').innerHTML = `
    <div class="respond-card">
      <div class="respond-kicker">${esc(cfg.kicker)}</div>
      <div class="respond-title" style="font-size:18px;">${esc(cfg.question)}</div>
      <div id="${cfg.id}_ropts">
        ${cfg.options.map((o,i)=>`<div class="respond-quiz-opt" id="${cfg.id}_ropt${i}" onclick="RESPONDQUIZ.answer('${cfg.id}',${i})">${esc(o)}</div>`).join('')}
      </div>
      <div id="${cfg.id}_rmsg" style="margin-top:10px; text-align:center; font-weight:700;"></div>
    </div>`;
}
const RESPONDQUIZ = {
  answer(id, idx){
    const cfg = SLIDES.find(x=>x.id===id);
    const isCorrect = idx===cfg.correct;
    LocalPoll.vote(id, idx, isCorrect);
    cfg.options.forEach((o,i)=>{
      const el = document.getElementById(id+'_ropt'+i);
      if(i===cfg.correct) el.classList.add('correct');
      else if(i===idx) el.classList.add('wrong');
    });
    const msg = document.getElementById(id+'_rmsg');
    msg.style.color = isCorrect ? 'var(--ok)' : 'var(--bad)';
    msg.textContent = isCorrect ? 'Correct! Thanks for answering.' : 'Not quite \u2014 the correct answer is highlighted in green.';
  }
};

function tryRenderRespondMode(){
  const hash = location.hash || '';
  if(!hash.startsWith('#respond=')) return false;
  const id = decodeURIComponent(hash.slice('#respond='.length));
  const cfg = SLIDES.find(x=>x.id===id);
  document.getElementById('app').style.display='none';
  const root = document.getElementById('respondRoot');
  root.style.display='flex';
  if(!cfg){
    root.innerHTML = `<div class="respond-card"><div class="respond-title">Not found</div><p>This link is invalid or has expired.</p></div>`;
    return true;
  }
  if(cfg.type==='evaluation') renderRespondEvaluation(cfg);
  else if(cfg.type==='quiz') renderRespondQuiz(cfg);
  return true;
}

// ====================================================================
// BOOT
// ====================================================================
if(!tryRenderAdminMode() && !tryRenderPublicPDF() && !tryRenderRespondMode()){
  renderAll();
  initQRCodes();
  SLIDES.forEach(s=>{ if(s.type==='quiz') QUIZFN.startPolling(s.id); });
  initEvalSummary();
  setInterval(initEvalSummary, 3000);
}
</script>
